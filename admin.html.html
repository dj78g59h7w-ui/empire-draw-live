<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Empire Draw</title>
<style>
html,body{margin:0;background:#080604;min-height:100%}
body{display:flex;justify-content:center;align-items:flex-start}
.stage{position:relative;width:min(100vw,1086px);aspect-ratio:1086/1448;overflow:hidden;user-select:none}
.base{position:absolute;inset:0;width:100%;height:100%;display:block}
.res{
 position:absolute;z-index:6;left:70.6%;width:15.2%;
 color:#ead3a0;font:700 clamp(7px,1.05vw,12px) Georgia,"Times New Roman",serif;
 line-height:1;white-space:nowrap;text-align:left;text-shadow:0 2px 3px #000;
 pointer-events:none;transform:translateY(-50%);
}
.rA{top:77.25%}
.rB{top:80.20%}
.rC{top:83.15%}
.rD{top:86.10%}
#spin{
 position:absolute;
 z-index:50;
 left:33.0%;
 top:73.0%;
 width:34.0%;
 height:8.5%;
 border:0;
 padding:0;
 margin:0;
 background:rgba(255,255,255,0.001);
 cursor:pointer;
 touch-action:manipulation;
 -webkit-tap-highlight-color:transparent;
 appearance:none;
 -webkit-appearance:none
}
#spin:disabled{cursor:default}
#status{
 position:absolute;z-index:6;left:35%;top:64.9%;width:30%;
 text-align:center;color:#edca69;font:700 clamp(9px,1.3vw,16px) Georgia,serif;
 text-shadow:0 2px 4px #000;pointer-events:none
}
#reset{
 position:absolute;z-index:7;left:39%;top:75.6%;width:22%;height:4%;
 display:none;border:1px solid #8c692f;border-radius:7px;background:rgba(20,14,9,.95);
 color:#efcc6c;font-weight:bold;cursor:pointer
}
.flash{
 position:absolute;z-index:4;left:12%;top:8%;width:76%;height:56.5%;
 border-radius:50%;opacity:0;pointer-events:none
}
.flash.on{opacity:1;box-shadow:inset 0 0 50px 12px rgba(255,220,120,.4)}

#soundToggle{
 position:absolute;z-index:60;right:1.5%;top:1.3%;
 border:1px solid #8c692f;border-radius:8px;
 background:rgba(20,14,9,.88);color:#efcc6c;
 font:700 clamp(8px,1vw,12px) Georgia,serif;
 padding:.45em .7em;cursor:pointer
}
#soundToggle.on{box-shadow:0 0 12px rgba(255,215,120,.45)}

</style>
</head>

// ----- Sound (no external audio file needed) -----
let audioCtx = null;
let soundEnabled = false;

function ensureAudio(){
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function tone(freq, when, duration, gain=0.035, type="sine"){
  if (!soundEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, when);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(gain, when + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, when + duration);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(when);
  osc.stop(when + duration + 0.05);
}

function playSpinSound(){
  if (!soundEnabled) return;
  ensureAudio();

  const t = audioCtx.currentTime + 0.04;

  // Original dark-epic build: low drones, war-drum pulses, then rising tension.
  [82.41, 98.00, 110.00].forEach((f,i)=>{
    tone(f, t + i*0.55, 1.4, 0.026, "sawtooth");
  });

  // Slow drum-like pulses for the first half.
  for (let i=0;i<8;i++){
    const when = t + i*0.82;
    tone(72 + (i%2)*10, when, 0.20, 0.05, "square");
    tone(145, when+0.02, 0.12, 0.018, "triangle");
  }

  // Rising orchestral-style tension.
  const rise = [146.83,164.81,196.00,220.00,246.94,293.66,329.63,392.00,440.00,523.25];
  rise.forEach((f,i)=>{
    tone(f, t + 4.8 + i*0.42, 0.34, 0.032 + i*0.0015, i%3===0 ? "sawtooth" : "triangle");
  });

  // Faster final countdown pulses.
  for (let i=0;i<10;i++){
    const when = t + 7.25 + i*0.24;
    tone(110 + i*11, when, 0.14, 0.038, "square");
  }
}

function playRevealSound(){
  if (!soundEnabled) return;
  ensureAudio();

  const t = audioCtx.currentTime + 0.02;

  // Original triumphant reveal chord.
  tone(130.81, t,       0.75, 0.055, "sawtooth");
  tone(261.63, t+0.02,  0.72, 0.048, "triangle");
  tone(392.00, t+0.08,  0.68, 0.048, "triangle");
  tone(523.25, t+0.18,  0.55, 0.052, "triangle");
  tone(783.99, t+0.32,  0.60, 0.040, "sine");
}

soundToggle.addEventListener("click", ()=>{
  ensureAudio();
  soundEnabled = !soundEnabled;
  soundToggle.textContent = soundEnabled ? "🔊 SOUND ON" : "🔇 SOUND OFF";
  soundToggle.classList.toggle("on", soundEnabled);
  if (soundEnabled) {
    const t = audioCtx.currentTime + 0.01;
    tone(660, t, 0.12, 0.035, "triangle");
    tone(880, t+0.10, 0.16, 0.035, "triangle");
  }
});

// ----- Visual animation -----
function stopPulse(){
  if (currentPulse) {
    clearInterval(currentPulse);
    currentPulse = null;
  }
  flash.classList.remove("on");
}

function startPulse(){
  stopPulse();
  flash.classList.add("on");
  currentPulse = setInterval(()=>flash.classList.toggle("on"), 150);
}

function clearTimers(){
  if (revealTimer) clearTimeout(revealTimer);
  if (finalizeTimer) clearTimeout(finalizeTimer);
  revealTimer = null;
  finalizeTimer = null;
}

function showBaseState(data){
  const results = data.results || {};
  groups.forEach(g => {
    document.getElementById("res"+g).textContent = results[g] || "";
  });

  const current = Number.isInteger(data.current) ? data.current : 0;
  const complete = data.complete === true || current >= groups.length;

  if (complete) {
    status.textContent = "DRAW COMPLETE";
    spin.style.display = "none";
    reset.style.display = "block";
  } else {
    status.textContent = "CURRENT GROUP: " + groups[current];
    spin.style.display = "block";
    reset.style.display = "none";
    spin.disabled = busy || data.spinning === true;
  }
}

function scheduleRevealAndFinalize(data){
  clearTimers();
  const revealAt = Number(data.revealAt || 0);
  const delay = Math.max(0, revealAt - Date.now());
  const group = groups[data.current] || groups[0];

  status.textContent = "DRAWING FOR GROUP " + group + "...";
  spin.disabled = true;
  startPulse();

  if (lastSpinToken !== data.spinToken) {
    lastSpinToken = data.spinToken;
    playSpinSound();
  }

  revealTimer = setTimeout(()=>{
    stopPulse();
    if (data.pendingResult && group) {
      document.getElementById("res"+group).textContent = data.pendingResult;
      status.textContent = "GROUP " + group + ": " + data.pendingResult;
      playRevealSound();
    }
  }, delay);

  finalizeTimer = setTimeout(async ()=>{
    try {
      await runTransaction(db, async transaction => {
        const snap = await transaction.get(drawRef);
        if (!snap.exists()) return;
        const d = snap.data();
        if (!d.spinning || d.spinToken !== data.spinToken) return;

        const idx = Number.isInteger(d.current) ? d.current : 0;
        const g = groups[idx];
        const results = { ...(d.results || {}) };
        if (g && d.pendingResult) results[g] = d.pendingResult;
        const next = idx + 1;

        transaction.set(drawRef, {
          results,
          current: next,
          complete: next >= groups.length,
          spinning: false,
          pendingResult: null,
          revealAt: null,
          spinToken: null
        }, { merge: true });
      });
    } catch(e) {
      console.error(e);
    }
  }, delay + 120);
}

onSnapshot(drawRef, async snap => {
  if (!snap.exists()) {
    try {
      await setDoc(drawRef, {
        results:{}, current:0, complete:false,
        spinning:false, pendingResult:null, revealAt:null, spinToken:null
      });
    } catch(e) {
      console.error(e);
      status.textContent = "FIREBASE ERROR";
    }
    return;
  }

  shared = snap.data() || {};
  showBaseState(shared);

  if (shared.spinning === true && shared.pendingResult && shared.revealAt) {
    scheduleRevealAndFinalize(shared);
  } else {
    clearTimers();
    stopPulse();
  }
}, err => {
  console.error(err);
  status.textContent = "FIREBASE ERROR";
});

// Any device can start the spin. Firestore guarantees only one active spin.
window.empireDraw = async function(){
  if (busy) return;
  busy = true;
  spin.disabled = true;

  try {
    await runTransaction(db, async transaction => {
      const snap = await transaction.get(drawRef);
      const data = snap.exists()
        ? snap.data()
        : { results:{}, current:0, complete:false, spinning:false };

      const idx = Number.isInteger(data.current) ? data.current : 0;
      if (data.spinning || data.complete || idx >= groups.length) return;

      const used = Object.values(data.results || {});
      const remaining = all.filter(x => !used.includes(x));
      if (!remaining.length) return;

      const chosen = remaining[Math.floor(Math.random()*remaining.length)];
      const token = Date.now().toString(36) + Math.random().toString(36).slice(2);

      transaction.set(drawRef, {
        spinning: true,
        pendingResult: chosen,
        revealAt: Date.now() + SPIN_MS,
        spinToken: token
      }, { merge: true });
    });
  } catch(e) {
    console.error(e);
    status.textContent = "FIREBASE ERROR";
  } finally {
    busy = false;
  }
};

reset.addEventListener("click", async function(){
  if (busy) return;
  busy = true;
  reset.disabled = true;
  clearTimers();
  stopPulse();

  try {
    await setDoc(drawRef, {
      results:{}, current:0, complete:false,
      spinning:false, pendingResult:null, revealAt:null, spinToken:null
    });
  } catch(e) {
    console.error(e);
    status.textContent = "FIREBASE ERROR";
  } finally {
    busy = false;
    reset.disabled = false;
  }
});
